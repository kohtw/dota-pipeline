# Local Airflow, Garage and the warehouse Postgres for the replay and Steam pipelines.
#   docker build -t dota-parser -f parser/Dockerfile .
#   docker compose up -d --build --remove-orphans
# UI: http://localhost:8080 (no login)
# Dashboard: http://localhost:8501
# S3 (Garage): http://localhost:3900 (API only; browse via garage-webui at http://localhost:3909), region us-east-1, path-style; creds below (dev only)

# fixed project name: the DAGs hard-code the network dota-pipeline_default, so no -p flag is needed
name: dota-pipeline

x-s3-creds: &s3-creds
  S3_ACCESS_KEY: GK1a2b3c4d5e6f7a8b9c0d1e2f
  S3_SECRET_KEY: 9f8e7d6c5b4a39281706f5e4d3c2b1a09f8e7d6c5b4a39281706f5e4d3c2b1a0

# warehouse Postgres (dev-only credentials); the host is the service name, not localhost
x-warehouse-conn: &warehouse-conn
  WAREHOUSE_HOST: warehouse
  WAREHOUSE_PORT: "5432"
  WAREHOUSE_USER: warehouse
  WAREHOUSE_PASSWORD: warehouse
  WAREHOUSE_DB: warehouse

x-airflow-common: &airflow-common
  build: ./airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    # shared across containers so api-server and scheduler trust each other's tokens
    AIRFLOW__API_AUTH__JWT_SECRET: local-dev-jwt-secret
    AIRFLOW__API__SECRET_KEY: local-dev-api-secret
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    <<: [*s3-creds, *warehouse-conn]
    S3_ENDPOINT: http://garage:3900
    # one key for every Airflow container, so Variables and Connections decrypt everywhere; from .env
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW_FERNET_KEY:?add AIRFLOW_FERNET_KEY to .env; generate one with: python3 -c "import base64,os; print(base64.urlsafe_b64encode(os.urandom(32)).decode())"}'
    STEAM_API_KEY: ${STEAM_API_KEY:-}  # from .env; https://steamcommunity.com/dev/apikey
    ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}  # from .env; blank disables the webhook
    # per-run batch sizes and job caps (dags/dota/config.py); raise them in .env on a bigger machine
    PARSE_BATCH: ${PARSE_BATCH:-}
    PARALLEL_PARSES: ${PARALLEL_PARSES:-}
    CLEAN_BATCH: ${CLEAN_BATCH:-}
    PARALLEL_CLEANS: ${PARALLEL_CLEANS:-}
    LOAD_BATCH: ${LOAD_BATCH:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt:ro  # read by dbt_build
    - ./warehouse/init:/opt/airflow/warehouse/init:ro  # DDL applied by dbt_build, steam_summary_elt and refresh_constants
    - dota-data:/data
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    docker-proxy:
      condition: service_started
    garage:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  # Airflow metadata database (DAG runs, Variables); the analytics data lives in `warehouse` below
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # analytics warehouse: the clean -> load -> dbt chain. Separate from the Airflow metadata database (airflow-db) above
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./warehouse/init:/docker-entrypoint-initdb.d:ro  # runs only on an empty volume
    ports:
      - "127.0.0.1:5433:5432"  # for host tools (notebooks, psql), loopback only; containers still use warehouse:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse", "-d", "warehouse"]
      interval: 5s
      retries: 10

  # Streamlit app over the dbt marts; reads only, so it starts without Airflow
  dashboard:
    build: ./dashboard
    environment:
      <<: *warehouse-conn
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      retries: 6

  # lets Airflow start the dota-parser container without giving it the raw docker socket
  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    environment:
      CONTAINERS: 1
      IMAGES: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # data lake (S3-compatible): raw/replays/{match_id}.dem, raw/parsed/{table}/match_id={match_id}/*.parquet
  garage:
    build: ./garage
    ports:
      - "127.0.0.1:3900:3900"  # S3 API
    environment:
      <<: *s3-creds
      S3_BUCKETS: raw
    volumes:
      - garage-data:/var/lib/garage
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      retries: 20

  # browser UI for Garage: http://localhost:3909 (no login)
  garage-webui:
    image: khairul169/garage-webui:1.1.0
    ports:
      - "127.0.0.1:3909:3909"
    environment:
      API_BASE_URL: http://garage:3903  # admin API
      API_ADMIN_KEY: 31c4c6bee1bcba9d0f6f148e60b44c8c4a3e3481168d8d8f33408519ecd8c5e1  # = admin_token in garage.toml
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: us-east-1
    depends_on:
      garage:
        condition: service_healthy

  airflow-init:
    <<: *airflow-common
    command: bash -c "airflow db migrate && airflow pools set spark 2 'Parser and Spark clean containers' && airflow pools set steam_api 1 'Steam Web API calls' && airflow pools set opendota_api 1 'OpenDota calls' && airflow pools set warehouse_write 1 'Warehouse loads and dbt build, never at once'"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg-data:
  garage-data:
  warehouse-data:
  dota-data:
    name: dota-data  # fixed name so the DAG's DockerOperator can mount it
