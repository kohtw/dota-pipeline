# Baseline reference data: heroes, items and patches from Valve's dota2.com datafeed, game modes from
# OpenDota (the datafeed has none). Each row is the version a key has before the refresh_constants
# DAG first observed it, so the dims (models/dims) work on a warehouse where the DAG never ran.
# Refresh with scripts/refresh_constants.py. Column tests live on the dims.
version: 2
seeds:
  - name: baseline_heroes
    description: "Baseline version of every hero (see dim_heroes)."
  - name: baseline_items
    description: "Baseline version of every item (see dim_items). localized_name is blank for a few recipes Valve leaves unnamed."
    config:
      column_types:
        item_id: integer
        is_recipe: boolean
        neutral_tier: integer
  - name: baseline_patches
    description: "Baseline list of gameplay patches (see dim_patches)."
    config:
      column_types:
        released_at: timestamp
  - name: baseline_game_modes
    description: "Baseline list of game modes (see dim_game_modes)."
