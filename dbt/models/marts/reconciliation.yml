version: 2
models:
  - name: steam_replay_reconciliation
    description: "One player of one match that is in both match_scoreboard and stg.steam_players: hero and final K/D/A from the replay next to Valve's match summary, plus K/D/A counted from death events. Matches the clean job rejected are not in the warehouse; scripts/reconcile_steam_replay.py covers those from the parsed files. The mart is empty until a match both passes clean and has a Steam row, so replay_scoreboard_matches_steam checks nothing until then."
    columns:
      - name: match_id
      - name: player_slot
        description: "Clean player_slot, 0-4 Radiant, 5-9 Dire. Steam's 128-132 are mapped to 5-9."
      - name: hero_id_replay
        description: "clean.players.hero_id (player_resource m_nSelectedHeroID)"
      - name: hero_id_steam
        description: "stg.steam_players.hero_id"
      - name: kills_replay
        description: "match_scoreboard.kills, from the last player_resource snapshot"
      - name: kills_steam
        description: "stg.steam_players.kills"
      - name: kills_events
        description: "kill_participation.kills_from_events, counted by credited_killer_slot rather than last hitter"
      - name: deaths_replay
      - name: deaths_steam
      - name: deaths_events
      - name: assists_replay
      - name: assists_steam
      - name: assists_events
        description: "Full counter-credited assist ledger, including same-side assists; not the participation-only numerator."
      - name: scoreboard_matches_steam
        description: "Hero and all three of K/D/A equal between replay and Steam. False when either side is NULL."
      - name: events_match_scoreboard
        description: "Replay K/D/A equal to credited kill/death/full-assist counts. False when either side is NULL."
