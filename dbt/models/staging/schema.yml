version: 2
models:
  - name: stg_steam_ranked
    description: "One player of every ranked All Pick match worth counting, from the Steam match summaries. Filter: lobby_type 7 (ranked), game_mode 22 (All Pick), duration at least 900 seconds (15 minutes), human_players 10, radiant_win known. Matches with leavers are kept: leaver_status is not filtered."
    columns:
      - name: match_id
        description: "Steam match ID; together with player_slot identifies one appearance."
        data_tests: [not_null]
      - name: player_slot
        description: "Steam player slot: 0-4 Radiant, 128-132 Dire. Composite key with match_id."
        data_tests:
          - not_null
          - accepted_values: {arguments: {values: [0, 1, 2, 3, 4, 128, 129, 130, 131, 132], quote: false}}
      - name: hero_id
        description: "Nullable Steam hero ID. Each non-null hero appears at most once per qualifying match, checked by steam_ranked_hero_unique_in_match. NULL IDs remain in staging but cannot form opponent pairs."
      - name: on_radiant
        description: "True when Steam player_slot < 128; valid slots are checked before downstream matchup analysis. Replay slot numbering is not used."
      - name: radiant_win
        description: "Known match result. A player wins when radiant_win equals on_radiant."
      - name: duration
        description: "Match duration in seconds, at least 900 after qualification."
      - name: gold_per_min
        description: "Steam-reported gold per minute, nullable when absent in the source. Zero is a recorded value."
      - name: xp_per_min
        description: "Steam-reported XP per minute, nullable when absent in the source. Zero is a recorded value."
      - name: hero_damage
        description: "Steam-reported full-match hero damage, nullable when absent. Not derived from replay damage events."
      - name: hero_healing
        description: "Steam-reported full-match hero healing, nullable when absent. Zero is a recorded value."
      - name: tower_damage
        description: "Steam-reported full-match tower damage, nullable when absent. Zero is a recorded value."

  - name: stg_replay_player_observations
    description: "One roster player per replay match and ten-second observation time. Latest snapshot at or before the grid time, then assessed for nonnegative net worth and age <= 5 seconds. Keeps missing/stale observations for coverage diagnostics. See docs/team-advantage-contract.md."
    columns:
      - name: match_id
        description: "Replay match ID; composite key with player_slot and observation_time_s."
        data_tests: [not_null]
      - name: player_slot
        description: "Clean player slot, 0-4 Radiant and 5-9 Dire."
        data_tests: [not_null]
      - name: team
        description: "Clean team: 2 Radiant or 3 Dire."
        data_tests: [not_null]
      - name: observation_time_s
        description: "Requested game-clock time on the ten-second grid, capped at recorded match duration."
        data_tests: [not_null]
      - name: snapshot_tick
        description: "Tick of the latest selected snapshot; NULL when no earlier snapshot exists."
      - name: snapshot_game_time_s
        description: "Actual selected snapshot game time; never later than the observation time."
      - name: snapshot_age_s
        description: "Observation time minus selected snapshot time; age 5 is fresh, age above 5 is stale. NULL when no snapshot exists; stale ages are retained."
      - name: net_worth
        description: "Selected snapshot's recorded net worth, including unusable NULL or negative values; never filled from older data."
      - name: is_usable
        description: "True only for recorded nonnegative net worth with snapshot age between zero and five seconds inclusive."
        data_tests: [not_null]

  - name: stg_hero_deaths
    description: "One scoreboard death (clean.deaths) with the victim's corpse position and respawn time. A dead hero stays at its corpse until it respawns and jumps to the fountain, so the corpse is the first position sample after the death tick and the respawn is the first later sample away from it, searched up to 240 seconds. Falls back to the last sample up to two seconds before the death when none follows it."
    columns:
      - name: match_id
        description: "Composite key with tick and victim_slot, as in clean.deaths; checked by event_marts_keys_unique."
        data_tests: [not_null]
      - name: victim_slot
        data_tests: [not_null]
      - name: x
        description: "World x of the corpse; NULL when the replay has no nearby sample."
      - name: y
        description: "World y of the corpse; NULL when the replay has no nearby sample."
      - name: respawn_s
        description: "Game time of the first sample away from the corpse (respawn or buyback); NULL when the replay ended first or has no corpse sample."
      - name: dead_s
        description: "respawn_s minus the death's game time; NULL with respawn_s."

  - name: stg_hero_positions
    description: "One clean.positions sample with is_alive. Dead from the death tick until respawn_s in stg_hero_deaths, or for 240 seconds when no respawn was found. A view: it is the size of clean.positions."
    columns:
      - name: match_id
        description: "Composite key with player_slot and tick, as in clean.positions; unique because the model groups by it."
        data_tests: [not_null]
      - name: is_alive
        data_tests: [not_null]
