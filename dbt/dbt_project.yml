# dbt project: builds the marts schema from the clean tables. See docs/clean-contract.md.
name: dota
version: "0.1.0"
config-version: 2
profile: dota

model-paths: ["models"]
test-paths: ["tests"]

models:
  dota:
    marts:
      +materialized: table
    staging:
      +materialized: view     # no +schema: lands in the target schema, like the seeds
